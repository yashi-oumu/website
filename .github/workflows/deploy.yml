name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for broken local asset references
        run: |
          set -euo pipefail
          refs=$(grep -rhoE '(href|src|srcset)="\./[^"]+"' index.html 404.html | sed -E 's/.*"\.\/([^"]+)".*/\1/' | sort -u)
          missing=0
          for ref in $refs; do
            if [ ! -e "$ref" ]; then
              echo "missing asset: $ref"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]
          echo "all local references resolve"

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Stage site
        run: |
          set -euo pipefail
          mkdir -p _site
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            ./ _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4